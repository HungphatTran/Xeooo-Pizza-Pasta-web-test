<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.3" stroke-dasharray="12 8" />
  
  <!-- Pizza Slice & Pasta Icon -->
  <g transform="translate(256, 240)">
    <!-- Pizza Slice -->
    <path d="M 0 -130 L 115 75 A 135 135 0 0 1 -115 75 Z" fill="url(#cheeseGrad)" stroke="#b45309" stroke-width="8" stroke-linejoin="round" />
    <!-- Pizza Crust -->
    <path d="M 125 70 A 148 148 0 0 1 -125 70 C -135 90 -100 110 -80 100 C -50 115 50 115 80 100 C 100 110 135 90 125 70 Z" fill="#b45309" stroke="#78350f" stroke-width="4" />
    <!-- Pepperoni / Basil toppings -->
    <circle cx="-35" cy="5" r="16" fill="#dc2626" opacity="0.9" />
    <circle cx="25" cy="-20" r="14" fill="#dc2626" opacity="0.9" />
    <circle cx="10" cy="40" r="18" fill="#dc2626" opacity="0.9" />
    <path d="M -15 -50 Q -5 -65 10 -55 Q 5 -40 -15 -50 Z" fill="#16a34a" />
    <path d="M 40 15 Q 55 5 50 30 Q 35 25 40 15 Z" fill="#16a34a" />
    <path d="M -60 30 Q -45 20 -50 45 Q -65 40 -60 30 Z" fill="#16a34a" />
  </g>
  
  <!-- Brand Text -->
  <text x="256" y="420" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="4">XÉOOO</text>
  <text x="256" y="455" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#a8a29e" text-anchor="middle" letter-spacing="6">PIZZA &amp; PASTA</text>
</svg>
