version: '3.8'

services:
  # 1. Database: Microsoft SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: xeooo-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=XeoooStrongP@ssw0rd2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'XeoooStrongP@ssw0rd2026!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Backend: Spring Boot 3 REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xeooo-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=XeoooRestaurantDB;encrypt=true;trustServerCertificate=true
      - DB_USER=sa
      - DB_PASSWORD=XeoooStrongP@ssw0rd2026!
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # 3. Frontend: React Vite PWA (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xeooo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
